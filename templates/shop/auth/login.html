{% extends "shop/base.html" %}
{% block title %}Đăng nhập | Shop Thời Trang{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width:480px"><h1 class="h2 mb-4">Đăng nhập</h1>
<form method="post" class="card card-body">{% csrf_token %}
    <div class="mb-3"><label class="form-label" for="username">Tên đăng nhập</label><input class="form-control" id="username" name="ten_dang_nhap" autocomplete="username" required></div>
    <div class="mb-3"><label class="form-label" for="password">Mật khẩu</label><input class="form-control" type="password" id="password" name="mat_khau" autocomplete="current-password" required></div>
    <button class="btn btn-primary" type="submit">Đăng nhập</button>
</form><p class="mt-3">Chưa có tài khoản? <a href="{% url 'register' %}">Đăng ký ngay</a></p></div>
<p class="text-center mt-3">Bạn là quản trị viên? <a href="{% url 'admin:index' %}">Đăng nhập tại cổng quản trị</a></p>
{% endblock %}
