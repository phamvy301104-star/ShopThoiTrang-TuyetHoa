{% extends "shop/base.html" %}
{% block title %}Đăng ký | Shop Thời Trang{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width:480px"><h1 class="h2 mb-4">Tạo tài khoản</h1>
<form method="post" class="card card-body">{% csrf_token %}
    <div class="mb-3"><label class="form-label" for="name">Họ tên</label><input class="form-control" id="name" name="ho_ten" value="{{ request.POST.ho_ten }}" required></div>
    <div class="mb-3"><label class="form-label" for="username">Tên đăng nhập</label><input class="form-control" id="username" name="ten_dang_nhap" value="{{ request.POST.ten_dang_nhap }}" autocomplete="username" required></div>
    <div class="mb-3"><label class="form-label" for="password">Mật khẩu (ít nhất 8 ký tự)</label><input class="form-control" type="password" id="password" name="mat_khau" autocomplete="new-password" required></div>
    <div class="mb-3"><label class="form-label" for="confirm">Xác nhận mật khẩu</label><input class="form-control" type="password" id="confirm" name="xac_nhan" autocomplete="new-password" required></div>
    <button class="btn btn-primary" type="submit">Đăng ký</button>
</form><p class="mt-3">Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a></p></div>
{% endblock %}
